name: IPA benchmark maintenance
on:
  pull_request:
    paths: ['.github/workflows/ipa-benchmark-maintenance.yml']
permissions: {}
jobs:
  release-stalled-benchmark:
    if: ${{ github.repository == 'goon-123/AnimeCompanion' && github.event.pull_request.number == 77 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      # Temporary one-off cleanup of this PR's two obsolete runs. No checkout,
      # untrusted code or user input; remove before the PR is ready for review.
      - name: Release the stuck upload and cancel its superseded queued retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/goon-123/AnimeCompanion/actions/runs/43092039329/force-cancel
          gh api --method POST repos/goon-123/AnimeCompanion/actions/runs/43096842848/cancel
