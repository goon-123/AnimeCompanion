name: iOS unsigned IPA
on:
  workflow_dispatch:
    inputs:
      use_build_cache:
        description: Reuse compatible build caches (disable for a clean benchmark)
        type: boolean
        default: true
      run_ui_tests:
        description: Run the longer iPhone and iPad simulator suites
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
jobs:
  mangabaka-contracts:
    name: MangaBaka public discovery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public taxonomy, covers and recommendation contracts
        run: python3 scripts/check-mangabaka-contracts.py
      - name: Exercise the app's live MangaBaka discovery clients
        run: env -u DEVELOPER_DIR ANIMECOMPANION_LIVE_SERVICES=1 swift test -j 2 --filter 'LiveServiceTests.testMangaBaka'
  manga-runtime:
    name: Build on-device manga runtime
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@v4
      - name: Fingerprint native toolchain and SDKs
        id: toolchain
        run: |
          fingerprint=$( {
            sw_vers -productVersion
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-build-version
            xcrun --sdk iphonesimulator --show-sdk-build-version
          } | shasum -a 256 | cut -d ' ' -f 1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"
      # Keep final iOS libraries and host test intermediates, not three copies
      # of cross-compiled Cargo dependency/build directories (previously 1.08 GB).
      - uses: actions/cache/restore@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_build_cache }}
        continue-on-error: true
        id: manga-runtime-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Tools/MangaRuntime/target/debug
            Tools/MangaRuntime/target/patched-dexvm
            Tools/MangaRuntime/target/aarch64-apple-ios/release/libanime_manga_runtime.a
            Tools/MangaRuntime/target/aarch64-apple-ios-sim/release/libanime_manga_runtime.a
            Tools/MangaRuntime/target/x86_64-apple-ios/release/libanime_manga_runtime.a
          key: manga-ios-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-rust-1.99.1-${{ hashFiles('Tools/MangaRuntime/Cargo.toml', 'Tools/MangaRuntime/Cargo.lock', 'Tools/MangaRuntime/src/**', 'Tools/MangaRuntime/include/**', 'Tools/MangaRuntime/support/**', 'Tools/MangaRuntime/test-support/**', 'scripts/build-manga-runtime.sh', 'scripts/prepare-manga-interpreter.py', 'scripts/test-manga-runtime.sh', 'scripts/manga-licenses.py', '.github/workflows/ios-build.yml') }}
      # One-time migration: use the old cache only as Cargo build inputs. A
      # legacy hit MUST go through cargo build; it cannot bypass compilation.
      - uses: actions/cache/restore@v4
        name: Seed a compact-cache miss from the previous Cargo cache
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.use_build_cache) && steps.manga-runtime-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Tools/MangaRuntime/target
          key: manga-ios-${{ runner.arch }}-${{ hashFiles('Tools/MangaRuntime/Cargo.lock') }}-${{ hashFiles('Tools/MangaRuntime/src/**', 'Tools/MangaRuntime/support/**', 'scripts/build-manga-runtime.sh', 'scripts/prepare-manga-interpreter.py') }}
      - name: Build device and universal simulator libraries
        run: |
          libraries=(
            Tools/MangaRuntime/target/aarch64-apple-ios/release/libanime_manga_runtime.a
            Tools/MangaRuntime/target/aarch64-apple-ios-sim/release/libanime_manga_runtime.a
            Tools/MangaRuntime/target/x86_64-apple-ios/release/libanime_manga_runtime.a
          )
          complete=true
          for library in "${libraries[@]}"; do
            if [[ ! -s "$library" ]]; then complete=false; fi
          done
          # Only a compact EXACT hit covers all native inputs plus the Xcode,
          # SDK and Rust versions. Repackage both simulator architectures.
          if [[ '${{ steps.manga-runtime-cache.outputs.cache-hit }}' == true && "$complete" == true ]] && command -v rustup >/dev/null; then
            source "$HOME/.cargo/env"
            rustup toolchain install 1.99.1 --profile minimal
            python3 scripts/prepare-manga-interpreter.py
            python3 scripts/manga-licenses.py
            mkdir -p build
            xcrun lipo -create "${libraries[1]}" "${libraries[2]}" -output build/libMangaRuntime-simulator.a
            rm -rf build/MangaRuntime.xcframework
            xcodebuild -create-xcframework \
              -library "${libraries[0]}" -headers Tools/MangaRuntime/include \
              -library build/libMangaRuntime-simulator.a -headers Tools/MangaRuntime/include \
              -output build/MangaRuntime.xcframework
          else
            bash scripts/build-manga-runtime.sh
          fi
      - name: Test real classic and modern APKs through the C bridge
        run: bash scripts/test-manga-runtime.sh
      - name: Preserve compiled runtime for retries
        if: ${{ success() && steps.manga-runtime-cache.outputs.cache-primary-key != '' && steps.manga-runtime-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Tools/MangaRuntime/target/debug
            Tools/MangaRuntime/target/patched-dexvm
            Tools/MangaRuntime/target/aarch64-apple-ios/release/libanime_manga_runtime.a
            Tools/MangaRuntime/target/aarch64-apple-ios-sim/release/libanime_manga_runtime.a
            Tools/MangaRuntime/target/x86_64-apple-ios/release/libanime_manga_runtime.a
          key: ${{ steps.manga-runtime-cache.outputs.cache-primary-key }}
      - name: Upload bundled manga runtime
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
          retention-days: 30
      - name: Upload pinned native test fixtures
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tools/MangaRuntime/target/fixtures
          retention-days: 30
      - name: Upload runtime license notices
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App/MangaRuntimeLicenses.txt
          retention-days: 30
  manga-reader:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
    needs: manga-runtime
    name: Webtoon reader ${{ matrix.device }} regression
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify covers, reading, saved positions and failed-page recovery
        run: bash scripts/check-simulator.sh ${{ matrix.device }} reader
      - name: Upload reader screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-reader-${{ matrix.device }}
          path: |
            build/reader-${{ matrix.device }}-screenshots
            build/reader-${{ matrix.device }}-diagnostics
            build/Reader-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  library-customization:
    # Longer device journeys are opt-in; routine updates prioritize the IPA.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.run_ui_tests && needs.build.result == 'success' && (needs['weekly-ui'].result == 'success' || needs['weekly-ui'].result == 'skipped') }}
    needs: [manga-runtime, build, weekly-ui]
    name: Reader and library changes ${{ matrix.device }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify automatic chapters, covers, combined library and tab visibility
        run: bash scripts/check-simulator.sh ${{ matrix.device }} customization
      - name: Upload feature screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-customization-${{ matrix.device }}
          path: |
            build/customization-${{ matrix.device }}-screenshots
            build/customization-${{ matrix.device }}-diagnostics
            build/Customization-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  visual-gallery:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
    needs: manga-runtime
    name: Native artwork gallery ${{ matrix.device }} regression
    runs-on: macos-15-intel
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify native gallery, pagination, viewer and denied-source fallback
        run: bash scripts/check-simulator.sh ${{ matrix.device }} visuals
      - name: Upload gallery screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-visuals-${{ matrix.device }}
          path: |
            build/visuals-${{ matrix.device }}-screenshots
            build/visuals-${{ matrix.device }}-diagnostics
            build/Visuals-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  safari-extension:
    name: Safari video detection and VidHub handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check extension resources and regressions
        run: |
          python3 scripts/check-safari-bundle.py
          npm --prefix Tools/SafariExtension ci --ignore-scripts --no-audit --no-fund
          npm --prefix Tools/SafariExtension test
      - name: Exercise real playback, embedded frames and SPA navigation
        run: |
          # Match the browser image to package-lock; avoid installing hundreds of
          # OS packages from a runner mirror before every unrelated app build.
          node -e "if (require('./Tools/SafariExtension/package.json').devDependencies.playwright !== '1.62.1') throw new Error('Update the pinned Playwright image with the package version')"
          docker run --rm --init --ipc=host \
            -v "$GITHUB_WORKSPACE:/work" -w /work/Tools/SafariExtension \
            mcr.microsoft.com/playwright:v1.62.1-noble npm run test:browser
      - name: Upload Safari browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-safari-browser
          path: build/safari-browser
          if-no-files-found: ignore
          retention-days: 30
  seanime-runtime:
    name: On-device extension runtime regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled compiler and test isolated provider contracts
        working-directory: Tools/SeanimeRuntime
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm test
  core:
    name: Core regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift package without waiting for a macOS runner
        run: |
          env -u DEVELOPER_DIR swift --version
          env -u DEVELOPER_DIR swift test -j 2
      - name: Check content-guarded build cache timestamps
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_cache_mtimes.py'
      - name: Check release privacy guards and source credentials
        run: |
          python3 scripts/test-release-privacy.py
          python3 scripts/check-release-privacy.py --source .
      - name: Verify current Keiyoushi repository and package checksums
        run: env -u DEVELOPER_DIR ANIMECOMPANION_LIVE_MANGA=1 swift test -j 2 --filter MangaExtensionTests.testLiveKeiyoushiCatalogWhenExplicitlyEnabled
      - name: Verify previous-season, top-anime and studio queries
        run: env -u DEVELOPER_DIR ANIMECOMPANION_LIVE_SERVICES=1 swift test -j 2 --filter LiveServiceTests.testAniListExploreShelvesAndStudio
  news-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
    needs: [manga-runtime, build, weekly-ui]
    name: News experience ${{ matrix.device }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify saved stories, personalization, filters and layouts
        run: bash scripts/check-simulator.sh ${{ matrix.device }} news
      - name: Upload news screenshots and native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-news-${{ matrix.device }}
          path: |
            build/news-${{ matrix.device }}-screenshots
            build/news-${{ matrix.device }}-diagnostics
            build/News-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  explore-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
    needs: [manga-runtime, build, weekly-ui]
    name: Explore, accounts and Airing Now ${{ matrix.device }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify discovery, account switching, saved libraries and Airing Now grids
        run: bash scripts/check-simulator.sh ${{ matrix.device }} explore
      - name: Upload Explore screenshots and native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-explore-${{ matrix.device }}
          path: |
            build/explore-${{ matrix.device }}-screenshots
            build/explore-${{ matrix.device }}-diagnostics
            build/Explore-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  weekly-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
    needs: [manga-runtime, build]
    name: Library and schedule ${{ matrix.device }} regression
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Check poster width, full-height artwork and the complete Today section
        run: |
          sudo mdutil -a -i off || true
          bash scripts/check-simulator.sh ${{ matrix.device }} presentation
      - name: Upload focused poster and Today screenshots immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-presentation-${{ matrix.device }}
          path: |
            build/presentation-${{ matrix.device }}-screenshots
            build/Presentation-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
      - name: Check clean library cards, catch-up, playback menus and calendar browsing
        run: |
          sudo mdutil -a -i off || true
          bash scripts/check-simulator.sh ${{ matrix.device }} schedule
      - name: Upload weekly screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-weekly-${{ matrix.device }}
          path: |
            build/weekly-${{ matrix.device }}-screenshots
            build/Weekly-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  focused-ui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
    needs: playback-fixes
    name: Focused ${{ matrix.device }} layout and playback
    runs-on: macos-15-intel
    # The expanded Phase 1/2 suites include native navigation and a cold boot.
    # Build 20's iPad runs exhausted the former 30/35-minute job limits.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify full-bleed artwork and direct playback
        run: |
          sudo mdutil -a -i off || true
          bash scripts/check-simulator.sh ${{ matrix.device }} focused
      - name: Upload focused screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-focused-${{ matrix.device }}
          path: |
            build/focused-${{ matrix.device }}-screenshots
            build/Focused-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  explore-fixes:
    # Device checks are opt-in; the user tests UI changes on their own devices.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
    name: Explore widget picker and Spotlight regressions
    needs: manga-runtime
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Check adding widgets and the Spotlight top edge
        run: bash scripts/check-simulator.sh iphone explore-fixes
      - name: Upload focused Explore screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-explore-fixes-iphone
          path: |
            build/explore-fixes-iphone-screenshots
            build/explore-fixes-iphone-diagnostics
            build/ExploreFixes-iphone.xcresult
          if-no-files-found: ignore
          retention-days: 30
  apple-cache-tests:
    name: Apple encrypted startup cache regressions
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fingerprint Apple Swift toolchain
        id: toolchain
        run: |
          fingerprint=$( {
            sw_vers -productVersion
            env -u DEVELOPER_DIR xcodebuild -version
            env -u DEVELOPER_DIR swift --version
          } | shasum -a 256 | cut -d ' ' -f 1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: swift-cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_build_cache }}
        continue-on-error: true
        with:
          path: .build
          key: apple-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/ci-cache-mtimes.py') }}-${{ hashFiles('Sources/**', 'Tests/AnimeCoreTests/**') }}
          restore-keys: |
            apple-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/ci-cache-mtimes.py') }}-
      - name: Restore unchanged Swift package input timestamps
        run: python3 scripts/ci-cache-mtimes.py restore .build/.ci-input-mtimes.json Sources Tests/AnimeCoreTests Package.swift Package.resolved
      - name: Verify encrypted AniList startup snapshots on Apple platforms
        run: env -u DEVELOPER_DIR swift test -j 2 --filter AniListLibraryCacheTests
      - name: Record successful Swift package input timestamps
        run: python3 scripts/ci-cache-mtimes.py save .build/.ci-input-mtimes.json Sources Tests/AnimeCoreTests Package.swift Package.resolved
      - uses: actions/cache/save@v4
        if: ${{ success() && steps.swift-cache.outputs.cache-primary-key != '' && steps.swift-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
  build:
    # These checks run alongside runtime preparation, rather than compiling a
    # second Swift package serially on the IPA runner. All must pass to ship.
    needs: [core, safari-extension, manga-runtime, apple-cache-tests, mangabaka-contracts, seanime-runtime]
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify Liquid Glass SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Fingerprint Xcode, SDK and project generator
        id: toolchain
        run: |
          fingerprint=$( {
            sw_vers -productVersion
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-build-version
            xcrun swift --version
            xcodegen --version
          } | shasum -a 256 | cut -d ' ' -f 1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: xcode-cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_build_cache }}
        continue-on-error: true
        with:
          # Do not cache the IPA, Payload, SDK stat caches, logs or test fixtures.
          path: |
            build/Build
            build/ModuleCache.noindex
            build/SourcePackages
            build/.ci-input-mtimes.json
          key: ipa-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved', 'scripts/ci-cache-mtimes.py', '.github/workflows/ios-build.yml') }}-${{ hashFiles('App/**', 'Sources/**', 'SafariExtension/**', 'Tools/SeanimeRuntime/package-lock.json', 'Tools/SeanimeRuntime/build.mjs', 'build/MangaRuntime.xcframework/**') }}
          restore-keys: |
            ipa-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('project.yml', 'Package.swift', 'Package.resolved', 'scripts/ci-cache-mtimes.py', '.github/workflows/ios-build.yml') }}-
      - name: Restore only content-matching Xcode input timestamps
        run: python3 scripts/ci-cache-mtimes.py restore build/.ci-input-mtimes.json App Sources SafariExtension AnimeCompanion.xcodeproj Package.swift Package.resolved build/MangaRuntime.xcframework
      - name: Compile universal iPhone and iPad app
        run: |
          xcodebuild -project AnimeCompanion.xcodeproj -scheme AnimeCompanion \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build -parallelizeTargets -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          python3 scripts/check-safari-bundle.py build/Build/Products/Release-iphoneos/AnimeCompanion.app
          python3 scripts/check-release-privacy.py build/Build/Products/Release-iphoneos/AnimeCompanion.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AnimeCompanion.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload AnimeCompanion-unsigned.ipa
          unzip -tq AnimeCompanion-unsigned.ipa
      - name: Upload universal build
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-unsigned-IPA
          path: AnimeCompanion-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Record successful Xcode input timestamps
        run: python3 scripts/ci-cache-mtimes.py save build/.ci-input-mtimes.json App Sources SafariExtension AnimeCompanion.xcodeproj Package.swift Package.resolved build/MangaRuntime.xcframework
      - uses: actions/cache/save@v4
        if: ${{ success() && steps.xcode-cache.outputs.cache-primary-key != '' && steps.xcode-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        with:
          path: |
            build/Build
            build/ModuleCache.noindex
            build/SourcePackages
            build/.ci-input-mtimes.json
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}
      - name: Check public data providers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
        continue-on-error: true
        env:
          ANIMECOMPANION_LIVE_SERVICES: '1'
        run: swift test -j 2 --filter LiveServiceTests
  playback-fixes:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
    needs: manga-runtime
    name: Full-width and split layout ${{ matrix.device }} regression
    runs-on: macos-15-intel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify full-width browsing, optional split layout and saved preferences
        run: bash scripts/check-simulator.sh ${{ matrix.device }} layout
      - name: Upload targeted screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-fixes-${{ matrix.device }}
          path: |
            build/fixes-${{ matrix.device }}-screenshots
            build/fixes-${{ matrix.device }}-diagnostics
            build/Fixes-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  simulator:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
    needs: playback-fixes
    name: ${{ matrix.label }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone
            label: iPhone simulator
            screenshots: build/screenshots
            results: build/SimulatorTests.xcresult
            screenshot-artifact: AnimeCompanion-simulator-screenshots
            result-artifact: AnimeCompanion-simulator-check
          - device: ipad
            label: 11-inch iPad Pro simulator
            screenshots: build/ipad-screenshots
            results: build/IPadTests.xcresult
            screenshot-artifact: AnimeCompanion-iPad-screenshots
            result-artifact: AnimeCompanion-iPad-simulator-check
    steps:
      - uses: actions/checkout@v4
      - name: Verify Liquid Glass SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Check native layout and navigation
        # Spotlight competes with CoreSimulator for disk on fresh hosted VMs.
        # Stop indexing for this disposable test runner, keeping UI checks intact.
        run: |
          sudo mdutil -a -i off || true
          bash scripts/check-simulator.sh ${{ matrix.device }}
      - name: Upload screenshot preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.screenshot-artifact }}
          path: |
            ${{ matrix.screenshots }}/*.png
            ${{ matrix.screenshots }}/*.txt
            ${{ matrix.screenshots }}/manifest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.result-artifact }}
          path: |
            ${{ matrix.screenshots }}
            ${{ matrix.results }}
          if-no-files-found: ignore
          retention-days: 30
