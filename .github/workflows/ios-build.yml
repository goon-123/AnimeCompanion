name: iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
jobs:
  manga-runtime:
    name: Build on-device manga runtime
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Tools/MangaRuntime/target
          key: manga-ios-${{ runner.arch }}-${{ hashFiles('Tools/MangaRuntime/Cargo.lock') }}-${{ hashFiles('Tools/MangaRuntime/src/**', 'Tools/MangaRuntime/support/**', 'scripts/build-manga-runtime.sh', 'scripts/prepare-manga-interpreter.py') }}
          restore-keys: |
            manga-ios-${{ runner.arch }}-${{ hashFiles('Tools/MangaRuntime/Cargo.lock') }}-
            manga-ios-${{ runner.arch }}-
      - name: Build device and universal simulator libraries
        run: bash scripts/build-manga-runtime.sh
      - name: Test real classic and modern APKs through the C bridge
        run: bash scripts/test-manga-runtime.sh
      - name: Upload bundled manga runtime
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
          retention-days: 30
      - name: Upload pinned native test fixtures
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tools/MangaRuntime/target/fixtures
          retention-days: 30
      - name: Upload runtime license notices
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App/MangaRuntimeLicenses.txt
          retention-days: 30
  manga-reader:
    needs: manga-runtime
    name: Webtoon reader ${{ matrix.device }} regression
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify covers, reading, saved positions and failed-page recovery
        run: bash scripts/check-simulator.sh ${{ matrix.device }} reader
      - name: Upload reader screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-reader-${{ matrix.device }}
          path: |
            build/reader-${{ matrix.device }}-screenshots
            build/reader-${{ matrix.device }}-diagnostics
            build/Reader-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  visual-gallery:
    needs: manga-runtime
    name: Native artwork gallery ${{ matrix.device }} regression
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify native gallery, pagination, viewer and denied-source fallback
        run: bash scripts/check-simulator.sh ${{ matrix.device }} visuals
      - name: Upload gallery screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-visuals-${{ matrix.device }}
          path: |
            build/visuals-${{ matrix.device }}-screenshots
            build/visuals-${{ matrix.device }}-diagnostics
            build/Visuals-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  safari-extension:
    name: Safari video detection and VidHub handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check extension resources and regressions
        run: |
          python3 scripts/check-safari-bundle.py
          npm --prefix Tools/SafariExtension ci --ignore-scripts --no-audit --no-fund
          npm --prefix Tools/SafariExtension test
      - name: Install WebKit browser
        working-directory: Tools/SafariExtension
        run: npx playwright install --with-deps webkit
      - name: Exercise real playback, embedded frames and SPA navigation
        run: npm --prefix Tools/SafariExtension run test:browser
      - name: Upload Safari browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-safari-browser
          path: build/safari-browser
          if-no-files-found: ignore
          retention-days: 30
  seanime-runtime:
    name: On-device extension runtime regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled compiler and test isolated provider contracts
        working-directory: Tools/SeanimeRuntime
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm test
  core:
    name: Core regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift package without waiting for a macOS runner
        run: |
          env -u DEVELOPER_DIR swift --version
          env -u DEVELOPER_DIR swift test -j 2
  weekly-ui:
    needs: playback-fixes
    name: Weekly schedule ${{ matrix.device }} regression
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Check today positioning and manual week browsing
        run: |
          sudo mdutil -a -i off || true
          bash scripts/check-simulator.sh ${{ matrix.device }} weekly
      - name: Upload weekly screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-weekly-${{ matrix.device }}
          path: |
            build/weekly-${{ matrix.device }}-screenshots
            build/Weekly-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  focused-ui:
    needs: playback-fixes
    name: Focused ${{ matrix.device }} layout and playback
    runs-on: macos-15
    # The expanded Phase 1/2 suites include native navigation and a cold boot.
    # Build 20's iPad runs exhausted the former 30/35-minute job limits.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify full-bleed artwork and direct playback
        run: |
          sudo mdutil -a -i off || true
          bash scripts/check-simulator.sh ${{ matrix.device }} focused
      - name: Upload focused screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-focused-${{ matrix.device }}
          path: |
            build/focused-${{ matrix.device }}-screenshots
            build/Focused-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  build:
    needs: [safari-extension, manga-runtime]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify Liquid Glass SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Core unit tests
        run: swift test -j 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile universal iPhone and iPad app
        run: |
          xcodebuild -project AnimeCompanion.xcodeproj -scheme AnimeCompanion \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          python3 scripts/check-safari-bundle.py build/Build/Products/Release-iphoneos/AnimeCompanion.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AnimeCompanion.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload AnimeCompanion-unsigned.ipa
      - name: Upload universal build
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-unsigned-IPA
          path: AnimeCompanion-unsigned.ipa
          retention-days: 30
      - name: Check public data providers
        continue-on-error: true
        env:
          ANIMECOMPANION_LIVE_SERVICES: '1'
        run: swift test -j 2 --filter LiveServiceTests
  playback-fixes:
    needs: manga-runtime
    name: Full-width and split layout ${{ matrix.device }} regression
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Verify full-width browsing, optional split layout and saved preferences
        run: bash scripts/check-simulator.sh ${{ matrix.device }} layout
      - name: Upload targeted screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimeCompanion-fixes-${{ matrix.device }}
          path: |
            build/fixes-${{ matrix.device }}-screenshots
            build/fixes-${{ matrix.device }}-diagnostics
            build/Fixes-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 30
  simulator:
    needs: playback-fixes
    name: ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone
            label: iPhone simulator
            screenshots: build/screenshots
            results: build/SimulatorTests.xcresult
            screenshot-artifact: AnimeCompanion-simulator-screenshots
            result-artifact: AnimeCompanion-simulator-check
          - device: ipad
            label: 11-inch iPad Pro simulator
            screenshots: build/ipad-screenshots
            results: build/IPadTests.xcresult
            screenshot-artifact: AnimeCompanion-iPad-screenshots
            result-artifact: AnimeCompanion-iPad-simulator-check
    steps:
      - uses: actions/checkout@v4
      - name: Verify Liquid Glass SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build bundled on-device JavaScript resources
        run: npm --prefix Tools/SeanimeRuntime ci --ignore-scripts --no-audit --no-fund && npm --prefix Tools/SeanimeRuntime run build
      - name: Download bundled on-device manga runtime
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-runtime
          path: build/MangaRuntime.xcframework
      - name: Download runtime license notices
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-licenses
          path: App
      - name: Download native runtime test fixtures
        uses: actions/download-artifact@v4
        with:
          name: AnimeCompanion-manga-fixtures
          path: Tests/MangaRuntimeTests/Fixtures
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Check native layout and navigation
        # Spotlight competes with CoreSimulator for disk on fresh hosted VMs.
        # Stop indexing for this disposable test runner, keeping UI checks intact.
        run: |
          sudo mdutil -a -i off || true
          bash scripts/check-simulator.sh ${{ matrix.device }}
      - name: Upload screenshot preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.screenshot-artifact }}
          path: |
            ${{ matrix.screenshots }}/*.png
            ${{ matrix.screenshots }}/*.txt
            ${{ matrix.screenshots }}/manifest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.result-artifact }}
          path: |
            ${{ matrix.screenshots }}
            ${{ matrix.results }}
          if-no-files-found: ignore
          retention-days: 30
