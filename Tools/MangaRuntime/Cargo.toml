[package]
name = "anime-manga-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Pin the interpreter: updating installed sources must not silently change the host runtime.
dexvm = { path = "target/patched-dexvm", features = ["keiyoushi"] }
base64 = "0.22"
dom_query = "=0.28.0"
fancy-regex = "=0.19.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "=0.3.55"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "unstable-locales"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_os = "ios")'.dependencies]
# rquickjs ships desktop bindings; generate the iOS ABI with Xcode's libclang.
rquickjs = { version = "=0.12.2", default-features = false, features = ["bindgen"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
