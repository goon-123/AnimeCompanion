name: companion_extensions
description: On-device AnymeX extension services for AnimeCompanion.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  anymex_extension_runtime_bridge:
    path: ../../build/AnymeXBridge
  get: ^4.7.3
  path_provider: ^2.1.5
  path: ^1.9.1
  video_player: ^2.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/anymex_desktop_runtime.jar
  module:
    androidX: true
    androidPackage: com.animecompanion.extensions
    iosBundleIdentifier: com.animecompanion.extensions
