name: AnimeCompanion
options:
  bundleIdPrefix: com.animecompanion
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  AnimeCore:
    path: .
targets:
  AnimeCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Anime Companion
        CFBundleURLTypes:
          - CFBundleURLName: AniListOAuth
            CFBundleURLSchemes:
              - animecompanion
        AniListClientID: ''
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animecompanion.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: AnimeCore
        product: AnimeCore
schemes:
  AnimeCompanion:
    build:
      targets:
        AnimeCompanion: all
    run:
      config: Debug
    archive:
      config: Release
