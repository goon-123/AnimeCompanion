name: AnimeCompanion
options:
  bundleIdPrefix: com.animecompanion
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.30.1'
    CURRENT_PROJECT_VERSION: '82'
packages:
  AnimeCore:
    path: .
targets:
  AnimeCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - SeanimeRuntimeResources
      - path: App/SeanimeRuntimeResources
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Anime Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: AniListOAuth
            CFBundleURLSchemes:
              - animecompanion
        AniListClientID: ''
        MangaBakaClientID: 'CNeUHLqjnLGiBGIJBbpzuoIiQYUhhuVK'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animecompanion.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: $(inherited) -lc++ -lz -liconv -lresolv
    dependencies:
      - package: AnimeCore
        product: AnimeCore
      - target: SafariVideoExtension
        embed: true
      - framework: build/MangaRuntime.xcframework
        embed: false
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
  SafariVideoExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: SafariExtension/SafariWebExtensionHandler.swift
      - path: SafariExtension/Resources
        buildPhase: resources
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: Anime Companion – VidHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animecompanion.ios.safari
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Automatic
  AnimeCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AnimeCompanionUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animecompanion.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: AnimeCompanion
    dependencies:
      - target: AnimeCompanion
  MangaRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MangaRuntimeTests
        excludes: [Fixtures, OwnedFixtures]
      - path: Tests/MangaRuntimeTests/Fixtures
        type: folder
        buildPhase: resources
      - path: Tests/MangaRuntimeTests/OwnedFixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animecompanion.ios.mangatests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AnimeCompanion.app/AnimeCompanion
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: AnimeCompanion
      - package: AnimeCore
        product: AnimeCore
      - framework: build/MangaRuntime.xcframework
        embed: false
schemes:
  AnimeCompanion:
    build:
      targets:
        AnimeCompanion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnimeCompanionUITests
        - MangaRuntimeTests
    archive:
      config: Release
