name: AnimeCompanion
options:
  bundleIdPrefix: com.animecompanion
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '9'
packages:
  AnimeCore:
    path: .
targets:
  AnimeCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Anime Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: AniListOAuth
            CFBundleURLSchemes:
              - animecompanion
        AniListClientID: ''
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animecompanion.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: AnimeCore
        product: AnimeCore
  AnimeCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AnimeCompanionUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animecompanion.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: AnimeCompanion
    dependencies:
      - target: AnimeCompanion
schemes:
  AnimeCompanion:
    build:
      targets:
        AnimeCompanion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnimeCompanionUITests
    archive:
      config: Release
